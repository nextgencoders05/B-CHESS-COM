<!-- Add these UI elements into index.html -->

<!-- 1. Mandatory Login / Skill Selection Modal -->
<div id="skillModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
  <div style="background: #1e293b; color: #f8fafc; padding: 28px; border-radius: 12px; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; font-family: sans-serif;">
    <h2 style="margin-top: 0; font-size: 1.4rem; color: #38bdf8;">செஸ் திறன் நிலையைத் தேர்ந்தெடுக்கவும்</h2>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px;">உங்கள் திறமைக்கேற்ப ஆரம்ப ரேட்டிங் வழங்கப்படும்.</p>
    
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <button onclick="selectSkillLevel('beginner')" style="padding: 12px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: 0.2s;">
        பிகினர் (Beginner - 800)
      </button>
      <button onclick="selectSkillLevel('intermediate')" style="padding: 12px; border-radius: 8px; border: none; background: #10b981; color: white; font-weight: bold; cursor: pointer; transition: 0.2s;">
        இன்டர்மீடியட் (Intermediate - 1200)
      </button>
      <button onclick="selectSkillLevel('advanced')" style="padding: 12px; border-radius: 8px; border: none; background: #8b5cf6; color: white; font-weight: bold; cursor: pointer; transition: 0.2s;">
        அட்வான்ஸ்டு (Advanced - 1600)
      </button>
    </div>
  </div>
</div>

<!-- 2. Resign & Draw Controls (Add near chessboard / game controls) -->
<div id="gameActionControls" style="display: flex; gap: 10px; margin: 10px 0;">
  <button id="offerDrawBtn" onclick="offerDrawGame()" style="flex: 1; padding: 8px 12px; background: #475569; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
    🤝 Draw கேட்க
  </button>
  <button id="resignBtn" onclick="resignCurrentGame()" style="flex: 1; padding: 8px 12px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
    🏳️ Resign (சரணடை)
  </button>
</div>

<!-- 3. In-Game Live Chat Box (Add to sidebar or below board) -->
<div id="chatContainer" style="background: #0f172a; border: 1px solid #334155; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; height: 260px; margin-top: 15px; font-family: sans-serif;">
  <div style="background: #1e293b; padding: 8px 12px; font-size: 0.85rem; font-weight: bold; color: #94a3b8; border-bottom: 1px solid #334155;">
    💬 நேரலை சாட் (Live Chat)
  </div>
  <div id="chatMessages" style="flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem; color: #e2e8f0;"></div>
  <form id="chatForm" onsubmit="handleSendChat(event)" style="display: flex; border-top: 1px solid #334155;">
    <input id="chatInput" type="text" placeholder="செய்தி அனுப்பவும்..." style="flex: 1; padding: 8px 12px; background: #1e293b; border: none; color: white; outline: none; font-size: 0.85rem;" />
    <button type="submit" style="background: #2563eb; color: white; border: none; padding: 0 16px; cursor: pointer; font-weight: bold;">Send</button>
  </form>
</div>
